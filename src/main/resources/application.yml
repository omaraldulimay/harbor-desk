server:
  port: ${PORT:8080}

spring:
  application:
    name: harbor-desk
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

harbor:
  db:
    # Owner role: migrations and onboarding only. The request path uses the app role.
    url: ${HARBOR_DB_URL:jdbc:postgresql://127.0.0.1:55434/harbor}
    admin-user: ${HARBOR_DB_ADMIN_USER:harbor}
    admin-password: ${HARBOR_DB_ADMIN_PASSWORD:harbor}
    app-user: ${HARBOR_DB_APP_USER:harbor_app}
    app-password: ${HARBOR_DB_APP_PASSWORD:harbor_app}
    pool-size: 10
  # HMAC secret for the demo tokens. In production the OIDC provider signs tokens, see ADR 0003 and 0005.
  jwt:
    secret: ${HARBOR_JWT_SECRET:}
  admin:
    key: ${HARBOR_ADMIN_KEY:}
  dev-tokens:
    enabled: false
